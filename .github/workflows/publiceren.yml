name: Publiceren en meten

on:
  schedule:
    - cron: "*/15 * * * *"   # elk kwartier: posts online zetten
    - cron: "17 4 * * *"     # dagelijks: statistieken
    - cron: "41 3 * * 1"     # maandag: token verversen
  push:
    paths: ["controle.txt"]   # Claude kan via dit bestand een verbindingstest starten
  workflow_dispatch:
    inputs:
      taak:
        description: "posten, statistieken, token of bediening"
        default: "posten"
      opdracht:
        description: "JSON-opdracht voor bediening (vanuit het dashboard)"
        default: "{}"

permissions:
  contents: write
  actions: write   # om 'Posts maken' te starten als er posts ontbreken

concurrency:
  group: bijbeltekst
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      gewijzigd: ${{ steps.opslaan.outputs.gewijzigd }}
    env:
      TZ: Europe/Amsterdam  # alle tijden in logboek en bediening in Nederlandse tijd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Beelden en video's koppelen (branch media)
        run: python3 tools/media.py koppel
      - name: Taak bepalen
        id: t
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then echo "taak=token" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "taak=${{ inputs.taak }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "17 4 * * *" ]; then echo "taak=statistieken" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "41 3 * * 1" ]; then echo "taak=token" >> $GITHUB_OUTPUT
          else echo "taak=posten" >> $GITHUB_OUTPUT; fi
      - name: PyNaCl voor token-verversing
        if: steps.t.outputs.taak == 'token' || steps.t.outputs.taak == 'bediening'
        run: pip install pynacl pillow numpy
      - name: Muziek en foto's ophalen (alleen bij bediening, als MATERIAAL_PAT bestaat)
        if: steps.t.outputs.taak == 'bediening'
        env:
          MATERIAAL_PAT: ${{ secrets.MATERIAAL_PAT }}
        run: |
          if [ -n "$MATERIAAL_PAT" ]; then
            git clone --depth 1 -q "https://x-access-token:${MATERIAAL_PAT}@github.com/sttpjoshua/bibleverse-materiaal.git" ../bibleverse-materiaal || echo "Materiaal ophalen mislukt"
            sh tools/ffmpeg.sh || true
          fi
      - name: Video's zonder muziek aanvullen (als een run zonder materiaal ze maakte)
        if: steps.t.outputs.taak == 'posten'
        env:
          MATERIAAL_PAT: ${{ secrets.MATERIAAL_PAT }}
        run: |
          if [ -n "$MATERIAAL_PAT" ] && python3 src/systeem.py aanvullen check; then
            pip install -q pillow numpy
            sh tools/ffmpeg.sh || true
            git clone --depth 1 -q "https://x-access-token:${MATERIAAL_PAT}@github.com/sttpjoshua/bibleverse-materiaal.git" ../bibleverse-materiaal || { echo "Materiaal ophalen mislukt"; exit 0; }
            python3 src/systeem.py aanvullen || echo "Aanvullen mislukt"
          fi
      - name: "Telegram: knoppen en opdrachten verwerken"
        if: steps.t.outputs.taak == 'posten'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          if [ -n "$TG_TOKEN" ] && python3 src/whatsapp.py heeft_updates; then
            pip install -q pillow numpy
            python3 src/whatsapp.py verwerk || echo "Telegram verwerken mislukt"
          fi
      - name: Uitvoeren
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
          OPDRACHT: ${{ inputs.opdracht }}
        run: |
          if [ "${{ steps.t.outputs.taak }}" = "bediening" ]; then
            python3 src/bediening.py
            # na een bediening meteen posten (voor 'nu posten') of de verbinding testen
            if echo "$OPDRACHT" | grep -q '"test"'; then python3 src/publiceer.py token; else python3 src/publiceer.py posten; fi
          else
            python3 src/publiceer.py ${{ steps.t.outputs.taak }}
          fi
          # elke maandag bij de tokencontrole: zelftest van beelden en video's
          if [ "${{ steps.t.outputs.taak }}" = "token" ]; then
            python3 tools/media.py samenpersen || true   # oude versies van beelden uit de geschiedenis
            sh tools/ffmpeg.sh || true
            python3 tools/zelftest.py || true
            python3 src/systeem.py dashboard
          fi
      - name: Nieuws bekijken (rond 7, 12 en 17 uur)
        if: steps.t.outputs.taak == 'posten'
        run: |
          uur=$(date +%H); min=$(date +%M)
          if { [ "$uur" = "07" ] || [ "$uur" = "12" ] || [ "$uur" = "17" ]; } && [ "$min" -lt 15 ]; then
            pip install -q pillow numpy
            python3 src/nieuws.py || echo "Nieuws bekijken mislukt"
          fi
      - name: Ontbrekende posts laten maken (zelfstandig, zonder Claude)
        if: steps.t.outputs.taak == 'posten' || steps.t.outputs.taak == 'bediening'
        env:
          GH_TOKEN: ${{ github.token }}
          OPDRACHT: ${{ inputs.opdracht }}
        run: |
          if echo "$OPDRACHT" | grep -q '"posts_maken"' || [ -f /tmp/start_maken ]; then gh workflow run maken.yml && echo "Posts maken gestart (dashboard of Telegram)"; exit 0; fi
          uur=$(date +%H)
          if [ "$uur" -ge 9 ] && [ "$uur" -le 21 ] && python3 src/systeem.py automaak check; then
            if ! gh run list --workflow maken.yml --status in_progress --json databaseId -q '.[0].databaseId' | grep -q .; then
              gh workflow run maken.yml && echo "Posts maken gestart"
            fi
          fi
      - name: WhatsApp-updates versturen
        if: always()
        env:
          WA_PHONE: ${{ secrets.WA_PHONE }}
          WA_KEY: ${{ secrets.WA_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: python3 src/whatsapp.py || true
      - name: Wijzigingen opslaan
        id: opslaan
        if: always()
        run: |
          git config user.name "bijbeltekst-bot"
          git config user.email "actions@users.noreply.github.com"
          sh tools/git_instellen.sh
          if python3 tools/media.py bewaar "Media: ${{ steps.t.outputs.taak }}" | grep -q gepusht; then echo "gewijzigd=1" >> $GITHUB_OUTPUT; fi
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          echo "gewijzigd=1" >> $GITHUB_OUTPUT
          git commit -m "Automatisch: ${{ steps.t.outputs.taak }}"
          for i in 1 2 3 4; do
            if git pull --rebase origin main; then git push && break
            else git rebase --abort 2>/dev/null; git pull --rebase -X theirs origin main && git push && break; fi
            sleep 5
          done

  website:
    # na elke run met wijzigingen: dashboard, kantoor en beelden opnieuw online zetten
    needs: run
    if: always() && needs.run.outputs.gewijzigd == '1'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
